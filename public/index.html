<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CartGuard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#e2e6ec;--blue:#0070ba;--green:#157f43;--amber:#a15c00;--red:#b3261e;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ecf2;--mute:#9aa5b4;--line:#28303b;--blue:#4aa3e0;--green:#46c080;--amber:#e0a43a;--red:#ef7b72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:20px;margin:0}h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.badges span{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-left:6px;color:var(--mute)}
main{display:grid;grid-template-columns:320px 1fr;gap:18px;max-width:1100px;margin:18px auto;padding:0 16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--red)}button.ok{background:var(--green)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips button{background:transparent;color:var(--blue);border:1px solid var(--line);padding:5px 10px;font-size:13px;border-radius:20px}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 2px}.meter>div{height:100%;background:var(--blue)}
.small{font-size:13px;color:var(--mute)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.s-paid{background:#157f4322;color:var(--green)}.s-denied,.s-rejected,.s-cancelled,.s-no_match{background:#b3261e22;color:var(--red)}
.s-pending_approval{background:#a15c0022;color:var(--amber)}.s-awaiting_payment{background:#0070ba22;color:var(--blue)}
.p{border-top:1px solid var(--line);padding:14px 0}.p:first-child{border-top:0;padding-top:0}
.checks{margin:8px 0;padding:0;list-style:none}.checks li{font-size:13px;margin:2px 0}.yes{color:var(--green)}.no{color:var(--red)}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.tl{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--mute)}
a.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:9px 14px;border-radius:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
</style>
</head>
<body>
<header>
  <h1>CartGuard <small>an AI shopper that can only spend inside your rules</small></h1>
  <div class="badges"><span id="b-pp">PayPal: …</span><span id="b-ai">AI: …</span></div>
</header>
<main>
  <section class="card" aria-label="Spending policy">
    <h2>Your spending rules</h2>
    <div class="small">The AI proposes. These rules decide. Plain code, not the AI, enforces them.</div>
    <label for="monthlyBudget">Monthly budget (USD)</label><input id="monthlyBudget" type="number" min="0" step="1">
    <label for="perPurchaseLimit">Max per purchase (USD)</label><input id="perPurchaseLimit" type="number" min="0" step="1">
    <label for="autoApproveUnder">Agent may order alone up to (USD)</label><input id="autoApproveUnder" type="number" min="0" step="1">
    <label for="allowedCategories">Allowed categories (comma separated)</label><input id="allowedCategories" type="text">
    <label for="blockedMerchants">Blocked merchants (comma separated)</label><input id="blockedMerchants" type="text">
    <div class="row" style="margin-top:12px"><button id="save">Save rules</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="small">Committed this month: <b id="committed">$0</b> of <b id="budget">$0</b></div>
    <div class="meter"><div id="bar" style="width:0%"></div></div>
    <div class="small">Remaining: <b id="remaining">$0</b></div>
  </section>

  <section>
    <div class="card">
      <h2>Ask the agent to buy something</h2>
      <textarea id="text" rows="2" placeholder="e.g. I need a USB-C hub for my laptop under $30"></textarea>
      <div class="row" style="margin-top:10px"><button id="go">Send to agent</button><span id="busy" class="small"></span></div>
      <div class="chips row" style="margin-top:10px">
        <button data-q="I need a USB-C hub for my laptop under $20">hub under $20 (auto)</button>
        <button data-q="Buy a mechanical keyboard under $70">keyboard $64 (needs approval)</button>
        <button data-q="Get me a game console bundle">console (denied)</button>
        <button data-q="Buy 2 gel pens, 12 colors">2 gel pens</button>
      </div>
    </div>
    <div class="card" style="margin-top:18px"><h2>Purchases and audit trail</h2><div id="list" class="small">Nothing yet.</div></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toFixed(2);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json(); if(!r.ok) throw new Error(j.error || 'error'); return j;
}
const LABEL = {paid:'Paid',denied:'Blocked by policy',rejected:'Rejected by you',cancelled:'Cancelled at PayPal',pending_approval:'Waiting for your approval',awaiting_payment:'Awaiting payment in PayPal',no_match:'No match'};
function render(s){
  $('b-pp').textContent = 'PayPal: ' + s.paypalMode; $('b-ai').textContent = 'AI: ' + s.ai;
  const p = s.policy;
  for (const k of ['monthlyBudget','perPurchaseLimit','autoApproveUnder']) if (document.activeElement !== $(k)) $(k).value = p[k];
  for (const k of ['allowedCategories','blockedMerchants']) if (document.activeElement !== $(k)) $(k).value = p[k].join(', ');
  $('committed').textContent = money(s.committed); $('budget').textContent = money(p.monthlyBudget); $('remaining').textContent = money(s.remaining);
  $('bar').style.width = Math.min(100, p.monthlyBudget ? s.committed / p.monthlyBudget * 100 : 0) + '%';
  const list = $('list');
  if (!s.purchases.length) { list.textContent = 'Nothing yet.'; return; }
  list.innerHTML = s.purchases.map(x => {
    const checks = (x.checks || []).map(c => `<li class="${c.ok ? 'yes' : 'no'}">${c.ok ? '✓' : '✗'} ${esc(c.rule)} <span class="small">(${esc(c.detail)})</span></li>`).join('');
    const hist = (x.history || []).map(h => `<li><b>${esc(h.event)}</b> ${esc(h.detail)}</li>`).join('');
    let actions = '';
    if (x.status === 'pending_approval') actions = `<div class="row"><button class="ok" data-act="approve" data-id="${esc(x.id)}">Approve</button><button class="danger" data-act="reject" data-id="${esc(x.id)}">Reject</button></div>`;
    if (x.status === 'awaiting_payment') actions = `<a class="btn" href="${esc(x.approveUrl)}">Pay with PayPal</a>`;
    return `<div class="p"><div class="row" style="justify-content:space-between"><b>${esc(x.item ? x.item.title : x.text)}</b><span class="pill s-${esc(x.status)}">${esc(LABEL[x.status] || x.status)}</span></div>
      <div class="small">“${esc(x.text)}” ${x.item ? '· ' + esc(x.quantity) + ' × ' + money(x.item.price) + ' = <b>' + money(x.total) + '</b> · ' + esc(x.item.merchant) : ''}</div>
      <ul class="checks">${checks}</ul>${actions}
      <details><summary>Audit trail (${(x.history || []).length} events)</summary><ul class="tl">${hist}</ul></details></div>`;
  }).join('');
}
async function refresh(){ render(await api('/api/state')); }
$('save').onclick = async () => {
  try { render(await api('/api/policy', {monthlyBudget:$('monthlyBudget').value, perPurchaseLimit:$('perPurchaseLimit').value, autoApproveUnder:$('autoApproveUnder').value, allowedCategories:$('allowedCategories').value, blockedMerchants:$('blockedMerchants').value})); toast('Rules saved'); } catch(e){ toast(e.message); }
};
$('go').onclick = async () => {
  const text = $('text').value.trim(); if (!text) return;
  $('go').disabled = true; $('busy').textContent = 'agent working…';
  try { const r = await api('/api/request', {text}); render(r.state); $('text').value = ''; } catch(e){ toast(e.message); }
  $('go').disabled = false; $('busy').textContent = '';
};
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { $('text').value = b.dataset.q; $('text').focus(); });
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  b.disabled = true;
  try { const r = await api('/api/' + b.dataset.act + '/' + b.dataset.id, {}); render(r.state); } catch(err){ toast(err.message); b.disabled = false; }
});
const q = new URLSearchParams(location.search);
if (q.get('paid')) toast('Payment captured. Purchase marked as paid.'); if (q.get('cancelled')) toast('Payment cancelled. Budget released.');
refresh();
</script>
</body>
</html>
